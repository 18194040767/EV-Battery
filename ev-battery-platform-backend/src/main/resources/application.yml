spring:
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
ml:
  python-path: python
  script-path: ../ml/predict.py
  timeout-seconds: 20
  startup-timeout-seconds: 45
  retry-count: 1
  warmup: true

llm:
  enabled: true
  api-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
  model: glm-5.1
  api-key: ${ZHIPU_API_KEY:}
